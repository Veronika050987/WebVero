<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>DOM Ani</title>
    <link rel="stylesheet" href="domanimation.css">
</head>
<body>
    <!--<h1>Document Object Model Animation</h1>-->
    <div id="container" onclick="Move()">
        <div id="animation" style="position: relative; width: 100px; height: 100px;">
        <img src="img/bat.png" alt="Летучая мышь" style="width: 170%; height: auto;">
            <div id="time-output" style="position: absolute; color: #ADFF2F; top: 103px; left: 45px; font-size: 20px; "></div>
        </div>
    </div>
    <br>
    <input type="number" id="interval" min="1" max="60" value="5" /><label for="interval">Interval</label>
    <input type="number" id="font-size" min="16" max="34" value="16" /><label for="font-size">Font size</label>
    <script src="domanimation.js"></script>
</body>
