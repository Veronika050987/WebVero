<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>DOM Ani</title>
    <link rel="stylesheet" href="domanimation.css">
</head>
<body>
    <!--<h1>Document Object Model Animation</h1>-->
    <div id="container" onclick="Move()">
        <div id="animation">
            <div id="time-output">--:--:--</div>
        </div>
    </div>
    <br>
    <input type="number" id="interval" min="1" max="60" value="5" /><label for="interval">Interval</label>
    <input type="number" id="font-size" min="16" max="34" value="16" /><label for="font-size">Font size</label>
    <script src="domanimation.js"></script>
</body>
</html>
