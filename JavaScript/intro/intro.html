<body>
    <h1>JavaScript PD_411</h1>
    <!--<h2>Factorial</h2>-->
    <details>
        <summary>Factorial</summary>
        <input type="number" id="factorial-source" min=0 placeholder="Исходное число для вычисления Факториала" onchange="Factorial2()" />
        <div id="factorial-result"></div>
    </details>

    <details>
        <summary>Power</summary>
        <h1>Калькулятор степеней</h1>
        <div class="container">
            <label for="base">Основание (Base):</label>
            <input type="number" id="base" value="1" placeholder="Выберите основание">

            <label for="exponent">Степень (Exponent):</label>
            <input type="number" id="exponent" value="2" placeholder="Выберите степень">

            <button id="calculateButton">Вычислить</button>
        </div>
        <h2>Результат:</h2>
        <p id="resultOutput"></p>
    </details>

    <details>
        <summary>Fibonacci sequence</summary>
        <h1>Генератор ряда Фибоначчи</h1>

        <div class="container">

            <!-- Выбор предопределенного предела -->
            <div class="limit-selection">
                <label for="limitPreset">Выбрать предел:</label>
                <select id="limitPreset">
                    <option value="10">10 чисел</option>
                    <option value="20">20 чисел</option>
                    <option value="30">30 чисел</option>
                    <option value="50">50 чисел (Макс. для примера)</option>
                </select>
            </div>

            <p class="separator">— ИЛИ —</p>

            <!-- Ручной ввод -->
            <div class="manual-input">
                <label for="count">Ввести количество чисел:</label>
                <input type="number" id="count" value="10" min="1" max="50">
            </div>

            <button id="generateButton">Сгенерировать ряд</button>
        </div>

        <h2>Результат:</h2>
        <div id="result" aria-live="polite"></div>
    </details>
