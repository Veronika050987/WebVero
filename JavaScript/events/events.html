<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="white">
    <div>Header</div>
    <span id="mouse"></span>
    <div style="display:flex;">
        <label for="delay">Delay: </label>
        <input type="number" id="delay" min="1" max="5" value="3">
    <div onclick="switchBackground()" id="switch-background">
        <!--<img src="img/moon.png" id="switch-background">-->
    </div>
    </div>
    <!--1-->
        <h1>Events</h1>
    <details>
        <summary>Image and color</summary>
        <div id="photo-and-color">
            <div id="select-photo" class="block">
                <div id="photo-container">
                    <img alt="Фото студента" title="Фото" id="photo">
                </div>
                <input type="file" id="image-file" onchange="setImage()">
            </div>
            <!--1-->
            <br>
            <div id="select-color" class="block">
                <input type="color" id="choose-color" onchange="setBackground()"><label for="choose-color">Выберите Ваш любимый цвет</label>
                <div id="color-sample"></div>
            </div>
        </div>
    </details>
    <details>
        <summary>Arrays</summary>
        <h2>Arrays</h2>
        <script>
            let arr = [3, 5, 8, 13, 21]
            console.log(arr);
            let values = [true, false, '+', 3.14, "Hello", 2.7];
            console.log(values);
            console.table(values);
                document.write(`<pre>`);
            for (let i = 0; i < arr.length; i++)
            {
                document.write(`${arr[i]}\t`);
            }
                document.write(`</pre>`);

            let arr2 =
                [
                    [1, 2, 3],
                    [4, 5, 6],
                    [7, 8, 9],
                ];
            document.write(`<pre>`);
            //foreach (let i : arr2) document.write(`${i}`);
            arr2.forEach((element) => document.write(element));
            document.writeln();
            for (let i = 0; i < arr2.length; i++)
            {
                for (let j = 0; j < arr2[i].length; j++)
                {
                    document.write(`${arr2[i][j]}\t`);
                }
                document.writeln();
            };
            document.write(`</pre>`);
            console.log(arr2);
            console.table(arr2);

            let jaggedArr =
                [
                    [3, 5, 8, 13, 21],
                    ["Хорошо", "живёт", "на", "свете", "Винни", "Пух"],
                    [34, 55, 89]
                ];
            console.log(jaggedArr);
            console.table(jaggedArr);
        </script>
    </details>
    <script src="functions.js"></script>
</body>
</html>
